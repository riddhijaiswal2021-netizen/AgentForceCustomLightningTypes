<template>
    <lightning-card title="Create Contact">
        <div class="slds-p-around_medium">

            <lightning-input
                name="accountName"
                label="Account Name"
                value={value.accountName}
                onchange={handleInputChange}
                required>
            </lightning-input>

            <lightning-input
                name="firstName"
                label="First Name"
                value={value.firstName}
                onchange={handleInputChange}
                required>
            </lightning-input>

            <lightning-input
                name="lastName"
                label="Last Name"
                value={value.lastName}
                onchange={handleInputChange}
                required>
            </lightning-input>

            <lightning-input
                name="email"
                label="Email"
                type="email"
                value={value.email}
                onchange={handleInputChange}
                required>
            </lightning-input>

        </div>
    </lightning-card>
</template>
